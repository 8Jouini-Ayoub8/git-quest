# 🤖 Quest Master — runs ONLY in the HQ (upstream) repository.
# It never checks out or runs code from forks: it clones them bare and reads git objects.
name: 🤖 Quest Master

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: quest-${{ github.event.issue.user.login || github.event.pull_request.user.login }}
  cancel-in-progress: false

jobs:
  quest:
    if: >-
      github.event.repository.fork == false && (
        (github.event_name == 'issues' && startsWith(github.event.issue.title, '[QUEST]')) ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/check') &&
          github.event.comment.user.login == github.event.issue.user.login) ||
        github.event_name == 'pull_request_target' )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout HQ (never the fork)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the Quest Master
        env:
          GITHUB_TOKEN: ${{ secrets.QUEST_TOKEN || secrets.GITHUB_TOKEN }}
          QUEST_SALT: ${{ secrets.QUEST_SALT }}
          FLAG_MODE: ${{ vars.FLAG_MODE }}
        run: python3 .github/quest/bot.py
