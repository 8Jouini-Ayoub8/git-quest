# 🚀 Deploy Agent Card — BONUS level. Builds a web page from your agent file and deploys it to GitHub Pages.
# Prerequisite: Settings → Pages → Source: "GitHub Actions".
name: 🚀 Deploy Agent Card

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.fork == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 🏗️ Build the agent card
        env:
          OWNER: ${{ github.repository_owner }}
        run: python3 .github/quest/build_card.py "$OWNER" _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌍 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
